name: Run Telegram bot (temporary)
on:
  push:
    branches: [main]
    paths:
      - bot.py
      - bot_single.py
      - questions.txt
      - requirements.txt
      - .github/workflows/run-bot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-osteology-bot
  cancel-in-progress: true
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python bot.py --check
      - name: Start bot for up to 5 hours 45 minutes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          DB_PATH: ${{ runner.temp }}/progress.sqlite3
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo 'Add the repository secret BOT_TOKEN before starting this workflow.'
            exit 1
          fi
          timeout --signal=INT --kill-after=30s 345m python -u bot.py || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ]; then
            exit "$status"
          fi
