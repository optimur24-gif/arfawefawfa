name: Stop temporary Telegram bot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-bot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-osteology-bot
  cancel-in-progress: true
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Temporary bot disabled. Start the bot on your own hosting.'
